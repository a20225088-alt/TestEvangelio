<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Personalidad - Evangelion</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(186, 85, 211, 0.2);
      border: 1px solid #ba55d3;
      text-align: center;
    }

    h1 {
      color: #ba55d3;
      margin-bottom: 20px;
    }

    .btn-option {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-option:hover {
      background-color: #3d2b4e;
      border-color: #ba55d3;
    }

    #character-image {
      max-width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin: 15px 0;
      border: 2px solid #ba55d3;
    }

    .btn-restart {
      background-color: #ba55d3;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-restart:hover {
      background-color: #9932cc;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANTALLA DEL TEST -->
    <div id="quiz-container">
      <h1>Test de Evangelion</h1>
      <h3 id="question-text">Cargando pregunta...</h3>
      <div id="options-container"></div>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="result-container" style="display: none;">
      <h1>Tu personaje es:</h1>
      <h2 id="character-name" style="color: #ba55d3;"></h2>
      
      <!-- IMAGEN DEL PERSONAJE -->
      <img id="character-image" src="" alt="Imagen del personaje">
      
      <p id="character-description" style="line-height: 1.5; text-align: justify;"></p>
      
      <button class="btn-restart" onclick="restartQuiz()">Hacer el test de nuevo</button>
    </div>
  </div>

  <script>
    // DATOS DE LOS PERSONAJES (Nombre, Descripción e Imagen)
    const characters = {
      shinji: {
        name: "Shinji Ikari",
        description: "Eres una persona introspectiva, sensible y reservada. Sueles sobrepensar las cosas y dudarlas antes de actuar, pero cuando te necesitan, demuestras una gran fortaleza interna.",
        image: "https://i.pinimg.com/736x/87/1c/91/871c91c3d1ba6bb1e967a5b3a4a1617e.jpg"
      },
      asuka: {
        name: "Asuka Langley Soryu",
        description: "Eres una persona orgullosa, competitiva y llena de energía. Te gusta destacar y demostrar tu valor ante los demás, aunque por dentro ocultas tus inseguridades tras una actitud fuerte.",
        image: "https://i.pinimg.com/736x/21/2b/9d/212b9d29f8db1f34dd688a2b5e2bf0b6.jpg"
      },
      rei: {
        name: "Rei Ayanami",
        description: "Eres una persona tranquila, analítica y misteriosa. Prefieres escuchar antes que hablar y te cuesta expresar tus emociones, pero eres increíblemente leal a tus deberes y convicciones.",
        image: "https://i.pinimg.com/736x/5f/1d/12/5f1d120a13d726bdf0c1cf192ff81290.jpg"
      }
    };

    // PREGUNTAS DEL TEST
    const questions = [
      {
        question: "¿Cómo reaccionas ante una situación de mucha presión?",
        options: [
          { text: "Dudo de mí mismo e intento evitar el conflicto.", character: "shinji" },
          { text: "Afronto el problema directo para demostrar que puedo superarlo.", character: "asuka" },
          { text: "Me mantengo sereno y sigo las instrucciones sin dudar.", character: "rei" }
        ]
      },
      {
        question: "¿Qué valoras más en tus relaciones personales?",
        options: [
          { text: "Que no me hagan daño ni me rechacen.", character: "shinji" },
          { text: "Que reconozcan mis logros y capacidad.", character: "asuka" },
          { text: "Un vínculo sincero, aunque no necesite hablar mucho.", character: "rei" }
        ]
      },
      {
        question: "Si te asignan una tarea difícil, tú...",
        options: [
          { text: "Siento que no soy el indicado, pero lo intento si me lo piden.", character: "shinji" },
          { text: "Exijo ser el líder y demostrar que soy el mejor.", character: "asuka" },
          { text: "Cumplo con mi deber sin cuestionar nada.", character: "rei" }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let scores = { shinji: 0, asuka: 0, rei: 0 };

    // INICIALIZAR TEST
    function loadQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById("question-text").textContent = q.question;
      
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(opt.character);
        optionsContainer.appendChild(btn);
      });
    }

    // REGISTRAR RESPUESTA Y AVANZAR
    function selectOption(characterKey) {
      scores[characterKey]++;
      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    // CALCULAR Y MOSTRAR RESULTADO FINAL CON IMAGEN
    function showResult() {
      let winner = "shinji";
      let maxScore = -1;

      for (const char in scores) {
        if (scores[char] > maxScore) {
          maxScore = scores[char];
          winner = char;
        }
      }

      const result = characters[winner];

      document.getElementById("character-name").textContent = result.name;
      document.getElementById("character-description").textContent = result.description;
      
      // Asigna la imagen dinámica según el ganador
      const img = document.getElementById("character-image");
      img.src = result.image;
      img.alt = `Imagen de ${result.name}`;

      document.getElementById("quiz-container").style.display = "none";
      document.getElementById("result-container").style.display = "block";
    }

    // REINICIAR EL TEST
    function restartQuiz() {
      currentQuestionIndex = 0;
      scores = { shinji: 0, asuka: 0, rei: 0 };
      document.getElementById("result-container").style.display = "none";
      document.getElementById("quiz-container").style.display = "block";
      loadQuestion();
    }

    // Cargar la primera pregunta al abrir la página
    loadQuestion();
  </script>
</body>
</html>
