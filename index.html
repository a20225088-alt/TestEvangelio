<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --rojo:#d92828;
    --azul:#4e8fd8;
    --morado:#8d6cc8;
    --amarillo:#e5b84b;
    --rosa:#e889a8;

    --fondo:#050507;
    --card:#111116;
    --texto:#f5f5f5;
    --gris:#aaa;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    color:var(--texto);

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(110,60,140,.25),
            transparent 40%

            circle at 10% 90%,
            rgba(30,80,150,.18),
            transparent 35%
        ),

        #050507;

    overflow-x:hidden;
}


/* =====================================
   ESTRELLAS
===================================== */

.estrellas{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:0;
}

.estrella{

    position:absolute;

    width:2px;
    height:2px;

    background:white;

    border-radius:50%;

    opacity:.5;

    animation:
        parpadear
        2s
        infinite
        alternate;
}

@keyframes parpadear{

    from{
        opacity:.15;
    }

    to{
        opacity:.8;
    }

}


/* =====================================
   CONTENEDOR
===================================== */

.contenedor{

    position:relative;

    z-index:2;

    width:min(94vw,650px);

    min-height:500px;

    padding:35px 28px;

    text-align:center;

    background:

        linear-gradient(
            145deg,
            rgba(20,20,27,.96),
            rgba(7,7,11,.98)
        );

    border:

        1px solid
        rgba(255,255,255,.12);

    border-radius:25px;

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.9),

        0 0 50px
        rgba(120,70,170,.12);

    animation:

        aparecer
        .7s
        ease;
}

@keyframes aparecer{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:none;
    }

}

===================================== */

    color:#999;

    margin-bottom:15px;

h1{

h2{

.texto{

.subtexto{

   INPUT
===================================== */

===================================== */

.boton{

.opciones{

.opcion{

    width:100%;

    text-align:left;

    border-radius:13px;

    border:

===================================== */

    to{

.descripcion{

.barra{

    margin:15px 0;

                "Que fui una persona única.",
            puntos:
                {asuka:1, shinji:1, rei:3, misato:1}
        },

        {
            texto:
                "Que siempre estuve ahí cuando me necesitaron.",
            puntos:
                {asuka:1, shinji:2, rei:1, misato:3}
        }

    ]

}

];


/* ==========================================
   VARIABLES
========================================== */

let nombre="";

let preguntaActual=0;

let puntos={

    asuka:0,

    shinji:0,

    rei:0,

    misato:0

};


const app =
    document.getElementById(
        "app"
    );


/* ==========================================
   PANTALLA INICIAL
========================================== */

function pantallaNombre(){

    app.innerHTML = `

        <div class="logo">

            NEON GENESIS

        </div>


        <h1>

            EVANGELION

        </h1>


        <p class="texto">

            ✦ TEST DE PERSONALIDAD ✦

        </p>


        <p class="texto">

            Hola.

            <br><br>

            Antes de comenzar necesito
            saber algo...

            <br>

            <b>¿Cómo te llamas?</b>

        </p>


        <input

            class="inputNombre"

            id="nombre"

            type="text"

            maxlength="25"

            placeholder="Escribe tu nombre..."

            autocomplete="off"

        >


        <br>


        <button

            class="boton"

            onclick="comenzar()">

            COMENZAR

        </button>


        <p class="subtexto">

            15 preguntas · 4 personajes · 1 resultado

        </p>

    `;


    setTimeout(()=>{

        const input =
            document.getElementById(
                "nombre"
            );

        input.focus();

        input.addEventListener(
            "keydown",
            function(e){

                if(
                    e.key === "Enter"
                ){

                    comenzar();

                }

            }
        );

    },100);

}


/* ==========================================
   COMENZAR
========================================== */

function comenzar(){

    const input =
        document.getElementById(
            "nombre"
        );

    nombre =
        input.value.trim();


    if(!nombre){

        input.style.borderColor =
            "#d92828";

        input.placeholder =
            "Escribe tu nombre primero...";

        return;

    }


    app.innerHTML = `

        <div class="logo">

            NEON GENESIS EVANGELION

        </div>


        <h1>

            Bienvenido/a,

            <span
                style="color:#dca4ed">

                ${nombre}

            </span>

        </h1>


        <p class="texto">

            Empecemos tu test de personalidad.

            <br><br>

            Responde las siguientes

            <b>15 preguntas</b>

            con la mayor sinceridad posible.

            <br><br>

            Al final descubriremos...

            <br>

            <b>

                ¿Qué personaje de Evangelion

                es más compatible contigo?

            </b>

        </p>


        <button

            class="boton"

            onclick="mostrarPregunta()">

            EMPEZAR TEST

        </button>

    `;

}


/* ==========================================
   MOSTRAR PREGUNTA
========================================== */

function mostrarPregunta(){

    const pregunta =
        preguntas[
            preguntaActual
        ];


    let opciones="";


    pregunta.opciones.forEach(
        (opcion,index)=>{

            opciones += `

                <button

                    class="opcion"

                    onclick="
                        responder(${index})
                    ">

                    ${String.fromCharCode(65+index)}.

                    ${opcion.texto}

                </button>

            `;

        }
    );


    app.innerHTML = `

        <div class="progreso">

            PREGUNTA

            ${preguntaActual+1}

            /

            ${preguntas.length}

        </div>


        <h2>

            ${nombre},

        </h2>


        <div class="pregunta">

            ${pregunta.pregunta}

        </div>


        <div class="opciones">

            ${opciones}

        </div>


        <p class="subtexto">

            Responde según lo que realmente harías.

        </p>

    `;

}


/* ==========================================
   RESPONDER
========================================== */

function responder(indice){

    const opcion =
        preguntas[
            preguntaActual
        ].opciones[
            indice
        ];


    puntos.asuka +=
        opcion.puntos.asuka;


    puntos.shinji +=
        opcion.puntos.shinji;


    puntos.rei +=
        opcion.puntos.rei;


    puntos.misato +=
        opcion.puntos.misato;


    preguntaActual++;


    if(
        preguntaActual >=
        preguntas.length
    ){

        mostrarCalculando();

    }else{

        mostrarPregunta();

    }

}


/* ==========================================
   PANTALLA DE CÁLCULO
========================================== */

function mostrarCalculando(){

    app.innerHTML = `

        <div class="logo">

            NERV SYSTEM

        </div>


        <h1>

            ${nombre}...

        </h1>


        <p class="cargando">

            Analizando tus respuestas...

        </p>


        <p class="subtexto">

            Comparando compatibilidad

            <br>

            con Asuka · Shinji · Rei · Misato

        </p>

    `;


    setTimeout(
        mostrarResultado,
        2500
    );

}


/* ==========================================
   RESULTADO
========================================== */

function mostrarResultado(){

    let ganador =
        "asuka";


    let mayor =
        puntos.asuka;


    if(
        puntos.shinji >
        mayor
    ){

        ganador =
            "shinji";

        mayor =
            puntos.shinji;

    }


    if(
        puntos.rei >
        mayor
    ){

        ganador =
            "rei";

        mayor =
            puntos.rei;

    }


    if(
        puntos.misato >
        mayor
    ){

        ganador =
            "misato";

        mayor =
            puntos.misato;

    }


    const personaje =
        personajes[
            ganador
        ];


    /*
        Calculamos porcentaje.

        El porcentaje se mantiene
        dentro de un rango bonito
        para que el resultado no
        parezca demasiado bajo.
    */


    const total =

        puntos.asuka +

        puntos.shinji +

        puntos.rei +

        puntos.misato;


    let porcentaje =
        Math.round(
            (mayor / total) * 100
        );


    if(
        porcentaje < 55
    ){

        porcentaje = 55;

    }


    if(
        porcentaje > 97
    ){

        porcentaje = 97;

    }


    app.innerHTML = `

        <div class="resultado">


            <div class="logo">

                ✦ RESULTADO FINAL ✦

            </div>


            <h2>

                ${nombre},

                tu personaje es...

            </h2>


            <img

                class="imagenPersonaje"

                src="${personaje.imagen}"

                alt="${personaje.nombre}"

                onerror="
                    this.style.display='none'
                "

            >


            <div

                class="nombrePersonaje
                ${personaje.clase}">

                ${personaje.nombre}

            </div>


            <div class="compatibilidad">

                ${porcentaje}% COMPATIBILIDAD

            </div>


            <div class="barra">

                <div

                    class="barraInterior"

                    style="
                        width:${porcentaje}%;

                        background:
                        ${personaje.color};
                    ">

                </div>

            </div>


            <p class="descripcion">

                ${personaje.descripcion}

            </p>


            <p class="texto">

                ✦ ${nombre} + ${personaje.nombre} ✦

            </p>


            <button

                class="boton"

                onclick="reiniciar()">

                HACER EL TEST OTRA VEZ

            </button>


        </div>

    `;

}


/* ==========================================
   REINICIAR
========================================== */

function reiniciar(){

    nombre="";

    preguntaActual=0;

    puntos={

        asuka:0,

        shinji:0,

        rei:0,

        misato:0

    };


    pantallaNombre();

}


/* ==========================================
   INICIAR
========================================== */

pantallaNombre();


</script>


</body>

</html>
